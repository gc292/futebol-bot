<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player rating · Futebol</title><link rel="stylesheet" href="/style.css"><script src="/vote.js" defer></script></head>
<body><header class="topbar"><a class="brand" href="/">⚽ FUTEBOL</a></header>
<main class="voting-page"><section class="voting-card"><h1 id="vote-title">Player rating</h1><p id="vote-summary" class="muted" role="status">Loading…</p><p id="vote-error" class="form-error" role="alert"></p>
<form id="vote-form" hidden><label class="field">Score (0–100)<input id="vote-score" type="number" min="0" max="100" step="any" required placeholder="e.g. 75"></label><button id="vote-submit" class="button primary" type="submit">Save vote</button><p class="roster-note">One vote per browser. Saving again updates your vote.</p></form>
<p id="vote-message" role="status"></p>
</section></main></body></html>
